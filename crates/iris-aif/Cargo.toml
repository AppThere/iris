[package]
name        = "iris-aif"
version     = "0.1.0"
description = "Artisan Interchange Format (.aif) read/write"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
authors.workspace     = true

[dependencies]
thiserror            = { workspace = true }
tracing              = { workspace = true }
uuid                 = { workspace = true }
iris-pixel           = { workspace = true }
iris-vector          = { workspace = true }
iris-ops             = { workspace = true }
quick-xml            = { workspace = true }
zip                  = { workspace = true }
# Phase 3 forward reference — vector path store (paths.bin). Unused in
# Phase 1. Not imported in any Phase 1 source file; no compiler warning
# is generated for unused deps without #[deny(unused_crate_dependencies)].
flatbuffers          = { workspace = true }
exr                  = { workspace = true }
appthere-file-access = { workspace = true }
loki-opc             = { workspace = true, features = ["serde", "strict"] }

# Desktop EXR (C++ bindings) — enabled by default, disabled on mobile
# [target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# openexr-rs = "3"   # Uncomment once appthere-opc gate is open
