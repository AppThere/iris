[package]
name        = "iris-canvas"
version     = "0.1.0"
description = "Iris infinite canvas: viewport, scroll model, compositor"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
authors.workspace     = true

[dependencies]
thiserror = { workspace = true }
tracing   = { workspace = true }
uuid      = { workspace = true }
iris-pixel  = { workspace = true }
iris-vector = { workspace = true }
appthere-canvas = { workspace = true, features = ["dioxus"] }
dioxus  = { workspace = true }
vello   = { workspace = true }
wgpu    = { workspace = true }
kurbo   = { workspace = true }
bytemuck = { workspace = true }
anyrender_vello = "0.6.2"

[dev-dependencies]
# Test-only: blocks on wgpu's async adapter/device/buffer-map futures in the
# headless GPU compositor tests. Flagged per CLAUDE.md (not in SPEC §14):
# dev-only, zero transitive dependencies, already in the workspace lockfile.
pollster = "0.4"
