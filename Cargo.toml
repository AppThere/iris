[workspace]
resolver = "2"
exclude = ["crates/loki-file-access", "crates/loki-opc", "crates/appthere-canvas"]
members = [
    "crates/appthere-ui",
    "crates/iris-app",
    "crates/iris-canvas",
    "crates/iris-pixel",
    "crates/iris-vector",
    "crates/iris-aif",
    "crates/iris-ops",
    "crates/iris-psd",
    "crates/iris-ora",
    "crates/iris-ai",
    "crates/iris-svg",
    "crates/iris-plugin-api",
    "crates/iris-tools",
    "tools/aif-inspect",
]

[workspace.package]
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0"
authors      = ["AppThere Project"]
repository   = "https://github.com/appthere/iris"

# Shared dependency versions — pin once here, reference with {version} = ...
[workspace.dependencies]
# AppThere shared crates (path deps until published — swap to version once on crates.io)
appthere-canvas      = { path = "crates/appthere-canvas", features = ["gpu", "font-cache"] }
appthere-color       = { version = "0.1" }
appthere-file-access = { package = "loki-file-access", path = "crates/loki-file-access" }
loki-opc             = { path = "crates/loki-opc", features = ["serde"] }

# AppThere UI shared crate
appthere-ui     = { path = "crates/appthere-ui" }

# Iris internal crates (path deps within this workspace)
iris-ops        = { path = "crates/iris-ops" }
iris-pixel      = { path = "crates/iris-pixel" }
iris-vector     = { path = "crates/iris-vector" }
iris-aif        = { path = "crates/iris-aif" }
iris-psd        = { path = "crates/iris-psd" }
iris-ora        = { path = "crates/iris-ora" }
iris-canvas     = { path = "crates/iris-canvas" }
iris-plugin-api = { path = "crates/iris-plugin-api" }
iris-tools      = { path = "crates/iris-tools" }

# External dependencies
dioxus          = { version = "=0.7.4", features = ["native"] }
vello           = { version = "0.6" }
wgpu            = { version = "26" }
kurbo           = { version = "0.11" }
parley          = { version = "0.2" }
loro            = { version = "1" }
thiserror       = { version = "2" }
uuid            = { version = "1", features = ["v4"] }
tracing         = { version = "0.1" }
lz4_flex        = { version = "0.11" }
flatbuffers     = { version = "24" }
# EXR: desktop uses openexr-rs (C++ bindings); mobile uses exr (pure Rust)
# Feature-gated per platform — see iris-aif/Cargo.toml
exr             = { version = "1" }
zip             = { version = "2" }
quick-xml       = { version = "0.36" }
serde           = { version = "1", features = ["derive"] }
proptest        = { version = "1" }
bytemuck        = { version = "1", features = ["derive"] }
png             = { version = "0.17" }
image           = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# PSD/PSB import (SPEC.md §5.1 names the `psd` crate for reading)
psd             = { version = "0.3" }

[patch.crates-io]
# COMPAT(dioxus): fontique patch removed — blitz-dom 0.2.4 resolves fontique 0.6.0
# from crates.io directly; the 0.8.0-based patch was version-mismatched and never
# applied. Re-evaluate if fontconfig_sys linkage errors appear on CI Linux.
# PATCH: vendors dioxus-native-dom to avoid runtime unimplemented!() panics in
# HtmlEventConverter (composition, touch, scroll, etc.) — remove when upstream
# implements the converters Loki requires.
dioxus-native-dom = { path = "crates/patches/dioxus-native-dom" }
# PATCH: handle_click fix for wgpu canvas focus behaviour.
# Remove when upstream blitz-dom makes tabindex focus on click work for
# non-input elements.
blitz-dom = { path = "crates/patches/blitz-dom" }
# PATCH: forwards WindowEvent::Touch to Dioxus touch handlers.
# Remove when blitz-shell implements touch natively.
blitz-shell = { path = "crates/patches/blitz-shell" }
# PATCH: handle SurfaceError::Outdated/Lost gracefully on Windows/DX12.
# Without this, registering a CustomPaintSource via use_wgpu panics on the
# first render cycle when the swap chain is not yet ready. Remove when
# wgpu_context upstream fixes the TODO at surface_renderer.rs:228.
wgpu_context = { path = "crates/patches/wgpu-context" }

[profile.dev]
opt-level = 1          # faster compiles, still debuggable

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1

# ── Workspace-root package (integration smoke tests only) ─────────────────────

[package]
name        = "iris-smoke"
version     = "0.0.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
authors.workspace     = true
publish     = false

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[dev-dependencies]
iris-ops   = { path = "crates/iris-ops" }
iris-pixel = { path = "crates/iris-pixel" }
iris-aif   = { path = "crates/iris-aif" }
loki-opc   = { path = "crates/loki-opc", features = ["serde", "strict"] }
uuid       = { workspace = true }
tempfile   = "3"
